<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>Barkot Fiyat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#17365d;color:#fff;padding:18px;text-align:center;font-size:25px;font-weight:800}
main{max-width:600px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0002}
button,input{width:100%;padding:14px;border-radius:11px;font-size:17px}input{border:1px solid #ccd2d9;margin-top:9px}
button{border:0;background:#17365d;color:#fff;font-weight:800;margin-top:10px}.gray{background:#667085}.red{background:#b42318}
.note{background:#eef6ff;padding:11px;border-radius:10px}.scanbox{position:relative;background:#000;border-radius:14px;overflow:hidden;margin-top:12px;min-height:250px}
#interactive{width:100%;height:300px;min-height:300px;max-height:300px;overflow:hidden;position:relative}
#interactive video{width:100%!important;height:100%!important;object-fit:cover!important;display:block}
.scanline{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#fff;box-shadow:0 0 8px #fff}
#scanner{display:none}.result{text-align:center;margin-top:14px}.name{font-size:25px;font-weight:800}.price{font-size:54px;font-weight:900;color:#087a3f}.code{color:#667085}
.item{padding:12px 0;border-bottom:1px solid #eee}.small{text-align:center;color:#667085;font-size:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.js"></script>
</head>
<body>
<header>📱 Barkot Fiyat</header>
<main>
<section class="card">
<div class="note"><b>Kitap barkodu:</b> Telefonu 15–25 cm uzakta tutun. Barkod yatay ve net görünsün.</div>
<button id="start" onclick="startScan()">📷 BARKOD OKU</button>
<div id="scanner">
<div class="scanbox"><div id="interactive" class="viewport"></div><div class="scanline"></div></div>
<button class="gray" onclick="stopScan()">Kamerayı Kapat</button>
<div class="small" id="status">EAN-13 kitap barkodu aranıyor…</div>
</div>
<div class="result"><div class="name" id="rname"></div><div class="price" id="rprice"></div><div class="code" id="rcode"></div>
<div id="stockInfo" style="font-size:18px;font-weight:800;margin-top:8px"></div>
<button id="saleBtn" style="display:none" onclick="sellOne()">🛒 SATIŞ YAP (-1 STOK)</button></div>
</section>
<section class="card">
<h2>Ürün / Fiyat Ekle</h2>
<input id="barcode" inputmode="numeric" placeholder="Barkod (örn. 9786257779760)">
<input id="pname" placeholder="Ürün adı">
<input id="pprice" inputmode="decimal" placeholder="Fiyat (TL)">
<input id="pstock" inputmode="numeric" type="number" min="0" step="1" placeholder="Stok sayısı">
<button onclick="save()">Kaydet</button>
</section>
<section class="card"><h2>Kayıtlı Ürünler (<span id="count">0</span>)</h2><div id="list"></div></section>
</main>
<script>
const KEY="barkot-fiyat-quagga";let db=JSON.parse(localStorage.getItem(KEY)||"{}");
Object.values(db).forEach(p=>{if(typeof p.stock!=="number")p.stock=Number(p.stock||0)});
let running=false,last="",lastAt=0,currentCode="";
function money(v){return Number(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" TL"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function show(code){
 code=String(code).replace(/\s/g,"");currentCode=code;
 document.getElementById("barcode").value=code;
 document.getElementById("rcode").textContent="Barkod: "+code;
 let p=db[code];
 if(p){
  document.getElementById("rname").textContent=p.name;
  document.getElementById("rprice").textContent=money(p.price);
  document.getElementById("stockInfo").textContent="Stok: "+Number(p.stock||0)+" adet";
  document.getElementById("saleBtn").style.display=Number(p.stock||0)>0?"block":"none";
 }else{
  document.getElementById("rname").textContent="Yeni barkod";
  document.getElementById("rprice").textContent="Fiyat girilmemiş";
  document.getElementById("stockInfo").textContent="Stok: 0 adet";
  document.getElementById("saleBtn").style.display="none";
 }
}
let scanProfile=0;
let scanTimer=null;

function startScan(){
 if(running)return;
 if(!window.Quagga){alert("Barkod okuyucu yüklenemedi. İnternet bağlantısını kontrol edin.");return}
 document.getElementById("start").style.display="none";
 document.getElementById("scanner").style.display="block";
 running=true;
 scanProfile=0;
 document.getElementById("status").textContent="Barkod aranıyor…";
 startQuaggaProfile();
}

function startQuaggaProfile(){
 if(!running)return;

 try{Quagga.stop()}catch(e){}
 try{Quagga.offDetected(onDetected)}catch(e){}

 const target=document.querySelector("#interactive");
 target.innerHTML="";

 const highDetail = scanProfile===1;

 Quagga.init({
   inputStream:{
     type:"LiveStream",
     target:target,
     constraints:{
       facingMode:{ideal:"environment"},
       width:{ideal:1920,min:1280},
       height:{ideal:1080,min:720},
       aspectRatio:{ideal:1.7777778}
     }
   },
   locator:{
     patchSize:highDetail?"small":"medium",
     halfSample:false
   },
   numOfWorkers:2,
   frequency:highDetail?20:15,
   decoder:{
     readers:["ean_reader"],
     multiple:false
   },
   locate:true
 },err=>{
   if(err){
     console.error(err);
     if(scanProfile===0){
       scanProfile=1;
       startQuaggaProfile();
       return;
     }
     alert("Kamera başlatılamadı. Safari kamera iznini kontrol edin.");
     stopScan();
     return;
   }

   Quagga.start();
   Quagga.onDetected(onDetected);

   setTimeout(applyCameraZoom,500);

   if(scanProfile===0){
     clearTimeout(scanTimer);
     scanTimer=setTimeout(()=>{
       if(running && scanProfile===0){
         scanProfile=1;
         document.getElementById("status").textContent="Yüksek hassasiyetle barkod aranıyor…";
         startQuaggaProfile();
       }
     },1800);
   }
 });
}

function applyCameraZoom(){
 try{
   const video=document.querySelector("#interactive video");
   if(!video || !video.srcObject)return;

   const track=video.srcObject.getVideoTracks()[0];
   if(!track)return;

   const caps=track.getCapabilities ? track.getCapabilities() : {};
   if(caps.zoom){
     const min=Number(caps.zoom.min||1);
     const max=Number(caps.zoom.max||min);
     const targetZoom=Math.min(max,Math.max(min,2));
     track.applyConstraints({advanced:[{zoom:targetZoom}]}).catch(()=>{});
   }
 }catch(e){}
}

function onDetected(data){
 let code=data&&data.codeResult&&data.codeResult.code;
 if(!code)return;

 let now=Date.now();
 if(code===last&&now-lastAt<1200)return;

 if(/^\d{13}$/.test(code)){
   last=code;
   lastAt=now;
   clearTimeout(scanTimer);
   show(code);
   stopScan();
 }
}

function stopScan(){
 if(running){try{Quagga.stop()}catch(e){}try{Quagga.offDetected(onDetected)}catch(e){}}
 running=false;document.getElementById("interactive").innerHTML="";document.getElementById("scanner").style.display="none";document.getElementById("start").style.display="block";
}
function save(){
 let b=document.getElementById("barcode").value.trim(),n=document.getElementById("pname").value.trim(),p=document.getElementById("pprice").value.replace(",",".").trim(),s=document.getElementById("pstock").value.trim();
 if(!b||!n||!p){alert("Barkod, ürün adı ve fiyatı doldurun.");return}
 let stock=s===""?0:Number(s);
 if(!Number.isFinite(stock)||stock<0||!Number.isInteger(stock)){alert("Stok sayısı 0 veya daha büyük tam sayı olmalıdır.");return}
 db[b]={name:n,price:Number(p),stock:stock};
 localStorage.setItem(KEY,JSON.stringify(db));render();show(b);
 document.getElementById("pname").value="";document.getElementById("pprice").value="";document.getElementById("pstock").value="";
 alert("Ürün kaydedildi. Stok: "+stock);
}
function sellOne(){
 if(!currentCode||!db[currentCode])return;
 let s=Number(db[currentCode].stock||0);
 if(s<=0){alert("⚠️ Stok tükendi.");return}
 db[currentCode].stock=s-1;
 localStorage.setItem(KEY,JSON.stringify(db));
 render();show(currentCode);
}
function edit(b){
 let p=db[b];
 document.getElementById("barcode").value=b;document.getElementById("pname").value=p.name;
 document.getElementById("pprice").value=p.price;document.getElementById("pstock").value=Number(p.stock||0);
 scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
function del(b){delete db[b];localStorage.setItem(KEY,JSON.stringify(db));render()}
function render(){
 let e=Object.entries(db);
 document.getElementById("count").textContent=e.length;
 document.getElementById("list").innerHTML=e.map(([b,p])=>`<div class="item"><b>${esc(p.name)}</b><br>${esc(b)} — ${money(p.price)} — Stok: ${Number(p.stock||0)}<button onclick="edit('${esc(b)}')">Düzenle</button><button class="red" onclick="del('${esc(b)}')">Sil</button></div>`).join("")||"<div class='small'>Henüz ürün yok.</div>";
}
render();
</script>
</body>
</html>
