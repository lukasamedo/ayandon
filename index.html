<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>Barkot Fiyat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#17365d;color:#fff;padding:18px;text-align:center;font-size:25px;font-weight:800}
main{max-width:600px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0002}
button,input{width:100%;padding:14px;border-radius:11px;font-size:17px}input{border:1px solid #ccd2d9;margin-top:9px}
button{border:0;background:#17365d;color:#fff;font-weight:800;margin-top:10px}.gray{background:#667085}.red{background:#b42318}
.note{background:#eef6ff;padding:11px;border-radius:10px}.scanbox{position:relative;background:#000;border-radius:14px;overflow:hidden;margin-top:12px;min-height:250px}
#interactive{width:100%;min-height:250px}#interactive video{width:100%;height:auto;display:block}
.scanline{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#fff;box-shadow:0 0 8px #fff}
#scanner{display:none}.result{text-align:center;margin-top:14px}.name{font-size:25px;font-weight:800}.price{font-size:54px;font-weight:900;color:#087a3f}.code{color:#667085}
.item{padding:12px 0;border-bottom:1px solid #eee}.small{text-align:center;color:#667085;font-size:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.js"></script>
</head>
<body>
<header>📱 Barkot Fiyat</header>
<main>
<section class="card">
<div class="note"><b>Kitap barkodu:</b> Telefonu 15–25 cm uzakta tutun. Barkod yatay ve net görünsün.</div>
<button id="start" onclick="startScan()">📷 BARKOD OKU</button>
<div id="scanner">
<div class="scanbox"><div id="interactive" class="viewport"></div><div class="scanline"></div></div>
<button class="gray" onclick="stopScan()">Kamerayı Kapat</button>
<div class="small" id="status">EAN-13 kitap barkodu aranıyor…</div>
</div>
<div class="result"><div class="name" id="rname"></div><div class="price" id="rprice"></div><div class="code" id="rcode"></div></div>
</section>
<section class="card">
<h2>Ürün / Fiyat Ekle</h2>
<input id="barcode" inputmode="numeric" placeholder="Barkod (örn. 9786257779760)">
<input id="pname" placeholder="Ürün adı">
<input id="pprice" inputmode="decimal" placeholder="Fiyat (TL)">
<button onclick="save()">Kaydet</button>
</section>
<section class="card"><h2>Kayıtlı Ürünler (<span id="count">0</span>)</h2><div id="list"></div></section>
</main>
<script>
const KEY="barkot-fiyat-quagga";let db=JSON.parse(localStorage.getItem(KEY)||"{}");let running=false,last="",lastAt=0;
function money(v){return Number(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" TL"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function show(code){
 code=String(code).replace(/\s/g,"");document.getElementById("barcode").value=code;document.getElementById("rcode").textContent="Barkod: "+code;
 let p=db[code];document.getElementById("rname").textContent=p?p.name:"Yeni barkod";document.getElementById("rprice").textContent=p?money(p.price):"Fiyat girilmemiş";
}
function startScan(){
 if(running)return;
 if(!window.Quagga){alert("Barkod okuyucu yüklenemedi. İnternet bağlantısını kontrol edin.");return}
 document.getElementById("start").style.display="none";document.getElementById("scanner").style.display="block";running=true;
 document.getElementById("status").textContent="EAN-13 barkodu aranıyor…";
 Quagga.init({
   inputStream:{type:"LiveStream",target:document.querySelector("#interactive"),constraints:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}},
   locator:{patchSize:"medium",halfSample:false},
   numOfWorkers:2,
   frequency:10,
   decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader"],multiple:false},
   locate:true
 },err=>{
   if(err){console.error(err);alert("Kamera başlatılamadı. Safari kamera iznini kontrol edin.");stopScan();return}
   Quagga.start();
 });
 Quagga.onDetected(onDetected);
}
function onDetected(data){
 let code=data&&data.codeResult&&data.codeResult.code;if(!code)return;
 let now=Date.now();if(code===last&&now-lastAt<2500)return;last=code;lastAt=now;
 if(/^\d{13}$/.test(code)){show(code);stopScan();}
}
function stopScan(){
 if(running){try{Quagga.stop()}catch(e){}try{Quagga.offDetected(onDetected)}catch(e){}}
 running=false;document.getElementById("interactive").innerHTML="";document.getElementById("scanner").style.display="none";document.getElementById("start").style.display="block";
}
function save(){
 let b=document.getElementById("barcode").value.trim(),n=document.getElementById("pname").value.trim(),p=document.getElementById("pprice").value.replace(",",".").trim();
 if(!b||!n||!p){alert("Barkod, ürün adı ve fiyatı doldurun.");return}
 db[b]={name:n,price:Number(p)};localStorage.setItem(KEY,JSON.stringify(db));render();show(b);
 document.getElementById("pname").value="";document.getElementById("pprice").value="";alert("Ürün kaydedildi.");
}
function edit(b){let p=db[b];document.getElementById("barcode").value=b;document.getElementById("pname").value=p.name;document.getElementById("pprice").value=p.price;scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
function del(b){delete db[b];localStorage.setItem(KEY,JSON.stringify(db));render()}
function render(){let e=Object.entries(db);document.getElementById("count").textContent=e.length;document.getElementById("list").innerHTML=e.map(([b,p])=>`<div class="item"><b>${esc(p.name)}</b><br>${esc(b)} — ${money(p.price)}<button onclick="edit('${esc(b)}')">Düzenle</button><button class="red" onclick="del('${esc(b)}')">Sil</button></div>`).join("")||"<div class='small'>Henüz ürün yok.</div>"}
render();
</script>
</body>
</html>
