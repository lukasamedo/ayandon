<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barkot Fiyat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#17365d;color:#fff;padding:20px;text-align:center;font-size:27px;font-weight:800}
main{max-width:600px;margin:auto;padding:15px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 3px 14px #0002}
button,input{width:100%;padding:15px;border-radius:12px;font-size:17px}input{border:1px solid #ccd2d9}button{border:0;background:#17365d;color:#fff;font-weight:800;margin-top:10px}
.gray{background:#667085}#cameraBox{display:none;margin-top:12px}video{width:100%;border-radius:14px;background:#000;display:block}
#result{text-align:center;margin-top:14px}.prod{font-size:25px;font-weight:800}.price{font-size:54px;font-weight:900;color:#087a3f}.code{color:#667085}
.item{padding:12px 0;border-bottom:1px solid #eee}.item button{padding:9px;font-size:14px}
.note{background:#eef6ff;padding:11px;border-radius:10px}
</style>
</head>
<body>
<header>📱 Barkot Fiyat</header>
<main>
<section class="card">
<div class="note">Barkodu kameranın ortasına tutun. Okuyunca fiyat otomatik gösterilir.</div>
<button id="scan" onclick="startScan()">📷 Barkod Oku</button>
<div id="cameraBox">
<video id="video" autoplay playsinline muted></video>
<button class="gray" onclick="stopScan()">Kamerayı Kapat</button>
</div>
<div id="result">
<div class="prod" id="prod"></div>
<div class="price" id="price"></div>
<div class="code" id="code"></div>
</div>
</section>

<section class="card">
<h2>Ürün / Fiyat Ekle</h2>
<input id="barcode" inputmode="numeric" placeholder="Barkod numarası">
<input id="name" placeholder="Ürün adı" style="margin-top:10px">
<input id="amount" inputmode="decimal" placeholder="Fiyat (TL)" style="margin-top:10px">
<button onclick="save()">Kaydet</button>
</section>

<section class="card">
<h2>Ürünler (<span id="count">0</span>)</h2>
<div id="list"></div>
</section>
</main>

<script src="https://unpkg.com/@zxing/browser@latest"></script>
<script>
let products=JSON.parse(localStorage.getItem("barkot-fiyat-products")||"{}");
let reader=null,controls=null;

function money(v){return Number(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" TL"}
function show(code){
 code=String(code).trim();let p=products[code];
 document.getElementById("code").textContent="Barkod: "+code;
 if(p){document.getElementById("prod").textContent=p.name;document.getElementById("price").textContent=money(p.price)}
 else{document.getElementById("prod").textContent="Ürün kayıtlı değil";document.getElementById("price").textContent=""}
}
async function startScan(){
 if(!window.isSecureContext){alert("Kamera için HTTPS bağlantısı gerekli.");return}
 if(!window.ZXingBrowser){alert("Barkod okuyucu yüklenemedi. İnternet bağlantısını kontrol edin.");return}
 await stopScan();
 document.getElementById("cameraBox").style.display="block";
 document.getElementById("scan").style.display="none";
 try{
  reader=new ZXingBrowser.BrowserMultiFormatReader();
  const formats=[
   ZXingBrowser.BarcodeFormat.EAN_13,ZXingBrowser.BarcodeFormat.EAN_8,
   ZXingBrowser.BarcodeFormat.UPC_A,ZXingBrowser.BarcodeFormat.UPC_E,
   ZXingBrowser.BarcodeFormat.CODE_128,ZXingBrowser.BarcodeFormat.CODE_39,
   ZXingBrowser.BarcodeFormat.ITF
  ];
  const hints=new Map();
  hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS,formats);
  reader=new ZXingBrowser.BrowserMultiFormatReader(hints);
  controls=await reader.decodeFromConstraints(
   {video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false},
   document.getElementById("video"),
   (result,error)=>{
    if(result){
      const text=result.getText();
      show(text);
      stopScan();
    }
   }
  );
 }catch(e){
  console.error(e);
  alert("Kamera açılamadı. Safari kamera iznini kontrol edin.");
  stopScan();
 }
}
async function stopScan(){
 try{if(controls)controls.stop()}catch(e){}
 controls=null;
 try{if(reader)reader.reset()}catch(e){}
 reader=null;
 const v=document.getElementById("video");
 if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}
 document.getElementById("cameraBox").style.display="none";
 document.getElementById("scan").style.display="block";
}
function save(){
 let b=document.getElementById("barcode").value.trim(),n=document.getElementById("name").value.trim(),a=document.getElementById("amount").value.replace(",",".").trim();
 if(!b||!n||!a){alert("Barkod, ürün adı ve fiyatı doldurun.");return}
 products[b]={name:n,price:Number(a)};localStorage.setItem("barkot-fiyat-products",JSON.stringify(products));
 render();show(b);document.getElementById("barcode").value="";document.getElementById("name").value="";document.getElementById("amount").value="";
}
function del(b){delete products[b];localStorage.setItem("barkot-fiyat-products",JSON.stringify(products));render()}
function render(){
 const e=Object.entries(products);document.getElementById("count").textContent=e.length;
 document.getElementById("list").innerHTML=e.map(([b,p])=>`<div class="item"><b>${p.name}</b><br>${b} — ${money(p.price)}<button class="gray" onclick="del('${b}')">Sil</button></div>`).join("")||"<div>Henüz ürün yok.</div>";
}
render();
</script>
</body>
</html>
