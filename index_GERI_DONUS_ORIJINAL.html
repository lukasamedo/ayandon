<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>Barkot Fiyat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#17365d;color:#fff;padding:18px;text-align:center;font-size:25px;font-weight:800}
main{max-width:600px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0002}
button,input{width:100%;padding:14px;border-radius:11px;font-size:17px}input{border:1px solid #ccd2d9;margin-top:9px}
button{border:0;background:#17365d;color:#fff;font-weight:800;margin-top:10px}.gray{background:#667085}.red{background:#b42318}
.note{background:#eef6ff;padding:11px;border-radius:10px}.scanbox{position:relative;background:#000;border-radius:14px;overflow:hidden;margin-top:12px;min-height:250px}
#interactive{width:100%;min-height:330px}#interactive video{width:100%;height:auto;display:block}
.scanline{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#fff;box-shadow:0 0 8px #fff}
#scanner{display:none}.result{text-align:center;margin-top:14px}.name{font-size:25px;font-weight:800}.price{font-size:54px;font-weight:900;color:#087a3f}.code{color:#667085}
.item{padding:12px 0;border-bottom:1px solid #eee}.small{text-align:center;color:#667085;font-size:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.js"></script>
</head>
<body>
<header>📱 Barkot Fiyat</header>
<main>
<section class="card">
<div class="note"><b>Kitap barkodu:</b> Telefonu 15–25 cm uzakta tutun. Barkod yatay ve net görünsün.</div>
<button id="start" onclick="startScan()">📷 BARKOD OKU</button>
<div id="scanner">
<div class="scanbox"><div id="interactive" class="viewport"></div><div class="scanline"></div></div>
<button class="gray" onclick="stopScan()">Kamerayı Kapat</button>
<div class="small" id="status">EAN-13 kitap barkodu aranıyor…</div>
</div>
<div class="result"><div class="name" id="rname"></div><div class="price" id="rprice"></div><div class="code" id="rcode"></div>
<div id="stockInfo" style="font-size:18px;font-weight:800;margin-top:8px"></div>
<button id="saleBtn" style="display:none" onclick="sellOne()">🛒 SATIŞ YAP (-1 STOK)</button></div>
</section>
<section class="card">
<h2>📦 Stok Sayımı</h2>
<div class="note">Barkodu her okuttuğunda sayım 1 artar. Kayıtsız ürünler de sayılabilir.</div>
<button onclick="toggleStockScan()" id="stockToggle">📷 STOK SAYIMI İÇİN OKUT</button>
<div id="stockReader" style="width:100%;margin-top:12px"></div>
<button id="stockStop" class="gray" style="display:none" onclick="stopStockScan()">Kamerayı Kapat</button>
<details style="margin-top:12px">
<summary style="font-weight:800;cursor:pointer">Sayım Listesi</summary>
<div id="stockList" style="margin-top:10px"></div>
</details>
</section>
<section class="card">
<h2>Ürün / Fiyat Ekle</h2>
<input id="barcode" inputmode="numeric" placeholder="Barkod (örn. 9786257779760)"><button type="button" class="gray" onclick="scanForProduct()">📷 Barkodu Okut</button>
<input id="pname" placeholder="Ürün adı">
<input id="pprice" inputmode="decimal" placeholder="Fiyat (TL)">
<button onclick="save()">Kaydet</button>
</section>
<section class="card">
<details>
<summary style="font-size:20px;font-weight:800;cursor:pointer">📦 Kayıtlı Ürünler (<span id="count">0</span>)</summary>
<div id="list" style="margin-top:12px"></div>
</details>
</section>
</main>
<script>
const KEY="barkot-fiyat-quagga";
const STOCK_KEY="barkot-fiyat-stock";
let db=JSON.parse(localStorage.getItem(KEY)||"{}");
let stockCount=JSON.parse(localStorage.getItem(STOCK_KEY)||"{}");
let running=false,last="",lastAt=0,currentCode="";
function money(v){return Number(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" TL"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function show(code){
 code=String(code).replace(/\s/g,"");
 currentCode=code;
 document.getElementById("barcode").value=code;
 document.getElementById("rcode").textContent="Barkod: "+code;
 let p=db[code];
 if(p){
  document.getElementById("rname").textContent=p.name;
  document.getElementById("rprice").textContent=money(p.price);
  document.getElementById("stockInfo").textContent="Stok: "+Number(p.stock||0)+" adet";
  document.getElementById("saleBtn").style.display=Number(p.stock||0)>0?"block":"none";
 }else{
  document.getElementById("rname").textContent="Yeni barkod";
  document.getElementById("rprice").textContent="Fiyat girilmemiş";
  document.getElementById("stockInfo").textContent="Sayım: "+Number(stockCount[code]||0)+" adet";
  document.getElementById("saleBtn").style.display="none";
 }
}

let productScanMode=false;

function scanForProduct(){
 if(running)return;
 productScanMode=true;
 startScan(true);
}
function startScan(isProduct=false){
 productScanMode = isProduct;
 if(running)return;
 if(!window.Quagga){alert("Barkod okuyucu yüklenemedi. İnternet bağlantısını kontrol edin.");return}
 document.getElementById("start").style.display="none";document.getElementById("scanner").style.display="block";running=true;
 document.getElementById("status").textContent="EAN-13 barkodu aranıyor…";
 Quagga.init({
   inputStream:{type:"LiveStream",target:document.querySelector("#interactive"),constraints:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}},
   locator:{patchSize:"medium",halfSample:false},
   numOfWorkers:2,
   frequency:10,
   decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader"],multiple:false},
   locate:true
 },err=>{
   if(err){console.error(err);alert("Kamera başlatılamadı. Safari kamera iznini kontrol edin.");stopScan();return}
   Quagga.start();
   setTimeout(applyCameraZoom, 700);
 });
 Quagga.onDetected(onDetected);
}
function applyCameraZoom(){
 try{
   const video=document.querySelector("#interactive video");
   if(!video||!video.srcObject)return;
   const track=video.srcObject.getVideoTracks()[0];
   if(!track)return;
   const caps=track.getCapabilities ? track.getCapabilities() : {};
   if(caps.zoom){
     const min=Number(caps.zoom.min||1), max=Number(caps.zoom.max||min);
     const target=Math.min(max, Math.max(min, 2));
     track.applyConstraints({advanced:[{zoom:target}]}).catch(()=>{});
     document.getElementById("status").textContent="Yakınlaştırılmış görüntüyle EAN-13 aranıyor…";
   }
 }catch(e){}
}
function onDetected(data){
 let code=data&&data.codeResult&&data.codeResult.code;if(!code)return;
 let now=Date.now();if(code===last&&now-lastAt<2500)return;last=code;lastAt=now;
 if(/^\d{13}$/.test(code)){
   if(productScanMode){
     document.getElementById("barcode").value=code;
     document.getElementById("status").textContent="Barkod alındı: "+code;
     productScanMode=false;
     stopScan();
     document.getElementById("pname").focus();
   }else{
     show(code);
     stopScan();
   }
}
}
function stopScan(){
 if(running){try{Quagga.stop()}catch(e){}try{Quagga.offDetected(onDetected)}catch(e){}}
 running=false;document.getElementById("interactive").innerHTML="";document.getElementById("scanner").style.display="none";document.getElementById("start").style.display="block";
}
function save(){
 let b=document.getElementById("barcode").value.trim(),n=document.getElementById("pname").value.trim(),p=document.getElementById("pprice").value.replace(",",".").trim();
 if(!b||!n||!p){alert("Barkod, ürün adı ve fiyatı doldurun.");return}
 if(db[b]){
   alert("⚠️ Bu barkod zaten kayıtlı!\n\nÜrün: "+db[b].name+"\nFiyat: "+money(db[b].price));
   return;
 }
 const counted=Number(stockCount[b]||0);
 db[b]={name:n,price:Number(p),stock:counted};
 delete stockCount[b];
 localStorage.setItem(KEY,JSON.stringify(db));
 localStorage.setItem(STOCK_KEY,JSON.stringify(stockCount));
 render();renderStockList();show(b);
 document.getElementById("pname").value="";document.getElementById("pprice").value="";
 alert("Ürün kaydedildi. Stok: "+counted);
}

function sellOne(){
 if(!currentCode||!db[currentCode])return;
 let s=Number(db[currentCode].stock||0);
 if(s<=0){alert("⚠️ Stok tükendi.");return}
 db[currentCode].stock=s-1;
 localStorage.setItem(KEY,JSON.stringify(db));
 render();show(currentCode);
}

let stockRunning=false;
function toggleStockScan(){
 if(stockRunning){stopStockScan();}else{startStockScan();}
}
function startStockScan(){
 if(stockRunning)return;
 if(!window.Quagga){alert("Barkod okuyucu yüklenemedi.");return}
 stockRunning=true;stockCandidate="";stockHits=0;stockLastCounted="";stockLastCountedAt=0;
 document.getElementById("stockToggle").textContent="⏹️ STOK SAYIMINI KAPAT";
 document.getElementById("stockStop").style.display="block";
 const target=document.getElementById("stockReader"); target.innerHTML="";
 Quagga.init({
  inputStream:{type:"LiveStream",target:target,constraints:{facingMode:{ideal:"environment"},width:{ideal:1920,min:1280},height:{ideal:1080,min:720}}},
  locator:{patchSize:"small",halfSample:false},
  numOfWorkers:2,frequency:15,
  decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader"],multiple:false},
  locate:true
 },err=>{
  if(err){alert("Kamera başlatılamadı.");stopStockScan();return}
  Quagga.start();
  setTimeout(()=>{
   try{
    const v=target.querySelector("video"),t=v&&v.srcObject&&v.srcObject.getVideoTracks()[0],c=t&&t.getCapabilities?t.getCapabilities():{};
    if(t&&c.zoom)t.applyConstraints({advanced:[{zoom:Math.min(Number(c.zoom.max||2),2)}]}).catch(()=>{});
   }catch(e){}
  },700);
 });
 Quagga.onDetected(onStockDetected);
}
let stockCandidate = "";
let stockHits = 0;
let stockLastCounted = "";
let stockLastCountedAt = 0;

function stockDetected(data){
  const code = data && data.codeResult && data.codeResult.code;
  if(!code || !/^\d{13}$/.test(code)) return;

  const now = Date.now();

  // Same barcode must be seen several times before it counts.
  if(code === stockCandidate){
    stockHits++;
  }else{
    stockCandidate = code;
    stockHits = 1;
  }

  // One physical item can only be counted once until it leaves the camera.
  if(code === stockLastCounted && now - stockLastCountedAt < 2200) return;

  if(stockHits < 3) return;

  stockLastCounted = code;
  stockLastCountedAt = now;
  stockCandidate = "";
  stockHits = 0;

  stockCount[code] = Number(stockCount[code] || 0) + 1;

  if(db[code]){
    db[code].stock = Number(db[code].stock || 0) + 1;
  }

  localStorage.setItem(STOCK_KEY, JSON.stringify(stockCount));
  localStorage.setItem(KEY, JSON.stringify(db));

  render();
  if(typeof renderStockList === "function") renderStockList();
  show(code);
}
function stopStockScan(){
 if(stockRunning){try{Quagga.stop()}catch(e){}try{Quagga.offDetected(onStockDetected)}catch(e){}}
 stockRunning=false;stockCandidate="";stockHits=0;
 document.getElementById("stockToggle").textContent="📷 STOK SAYIMI İÇİN OKUT";document.getElementById("stockReader").innerHTML="";document.getElementById("stockStop").style.display="none";
}
function renderStockList(){
 const keys=[...new Set([...Object.keys(stockCount),...Object.keys(db).filter(k=>Number(db[k].stock||0)>0)])];
 document.getElementById("stockList").innerHTML=keys.map(b=>{
  const p=db[b], name=p?p.name:"Kayıtsız Ürün", count=p?Number(p.stock||0):Number(stockCount[b]||0);
  return `<div class="item"><b>${esc(name)}</b><br>${esc(b)} — ${count} adet</div>`;
 }).join("")||"<div class='small'>Henüz stok sayımı yapılmadı.</div>";
}
function edit(b){let p=db[b];document.getElementById("barcode").value=b;document.getElementById("pname").value=p.name;document.getElementById("pprice").value=p.price;scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
function del(b){delete db[b];localStorage.setItem(KEY,JSON.stringify(db));render()}
function render(){let e=Object.entries(db);document.getElementById("count").textContent=e.length;document.getElementById("list").innerHTML=e.map(([b,p])=>`<div class="item"><b>${esc(p.name)}</b><br>${esc(b)} — ${money(p.price)} — Stok: ${Number(p.stock||0)}<button onclick="edit('${esc(b)}')">Düzenle</button><button class="red" onclick="del('${esc(b)}')">Sil</button></div>`).join("")||"<div class='small'>Henüz ürün yok.</div>"}
render();renderStockList();
</script>
</body>
</html>
